[package]
name = "autodesc"
version = "0.2.0"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]
edition = "2024"
description = "Automatic description generator for Wikidata items"
repository = "https://github.com/magnusmanske/autodesc"

[[bin]]
name = "autodesc-server"
path = "src/bin/main.rs"

[lib]
name = "autodesc"
path = "src/lib.rs"

[dependencies]
mimalloc = { version = "0.1", features = ["secure"] }

# Web framework
axum = { version = "0.8", features = ["query"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "load-shed", "buffer"] }
tower-http = { version = "0.7", features = ["compression-full", "set-header", "limit"] }

# Rate limiting
governor = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "query"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# Utilities
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = ["date", "entity-id", "escape", "http", "logging", "server", "sparql-client", "telemetry", "title"] }
regex = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
serde_urlencoded = "0.7"
